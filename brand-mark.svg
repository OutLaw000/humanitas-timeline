<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 72" fill="none" role="img" aria-label="AmeriKing">
  <!--
    Minimal constellation crown — editorial, site-native.
    Thin luminous linework + nodes (matches hero constellation vibe).
  -->
  <defs>
    <linearGradient id="akStroke" x1="8" y1="4" x2="88" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f3e8ff"/>
      <stop offset="0.45" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#7c3aed"/>
      <animateTransform attributeName="gradientTransform" type="rotate"
        from="0 48 36" to="360 48 36" dur="16s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="akFill" x1="48" y1="8" x2="48" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c084fc" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#a855f7" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0.04"/>
    </linearGradient>
    <radialGradient id="akAura" cx="50%" cy="48%" r="50%">
      <stop stop-color="#a855f7" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="akSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      <![CDATA[
      .aura {
        animation: aura 5s ease-in-out infinite;
        transform-origin: 48px 38px;
      }
      .mark {
        animation: drift 6s ease-in-out infinite;
        transform-origin: 48px 38px;
      }
      .wire {
        fill: none;
        stroke: url(#akStroke);
        stroke-width: 1.65;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 220;
        animation: draw 7s ease-in-out infinite;
      }
      .ghost {
        fill: url(#akFill);
        animation: breath 5s ease-in-out infinite;
      }
      .node {
        fill: #f3e8ff;
        animation: node 2.4s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .n1 { animation-delay: 0s; }
      .n2 { animation-delay: 0.25s; }
      .n3 { animation-delay: 0.5s; }
      .n4 { animation-delay: 0.15s; }
      .n5 { animation-delay: 0.4s; }
      .base {
        stroke: url(#akStroke);
        stroke-width: 1.35;
        stroke-linecap: round;
        opacity: 0.85;
        animation: base 5s ease-in-out infinite;
      }

      @keyframes aura {
        0%, 100% { opacity: 0.5; transform: scale(0.96); }
        50% { opacity: 1; transform: scale(1.06); }
      }
      @keyframes drift {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-1.5px); }
      }
      @keyframes draw {
        0% { stroke-dashoffset: 220; opacity: 0.55; }
        28% { stroke-dashoffset: 0; opacity: 1; }
        72% { stroke-dashoffset: 0; opacity: 1; }
        100% { stroke-dashoffset: -28; opacity: 0.75; }
      }
      @keyframes breath {
        0%, 100% { opacity: 0.65; }
        50% { opacity: 1; }
      }
      @keyframes node {
        0%, 100% { opacity: 0.55; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1.15); }
      }
      @keyframes base {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .aura, .mark, .wire, .ghost, .node, .n1, .n2, .n3, .n4, .n5, .base {
          animation: none !important;
        }
        .wire { stroke-dasharray: none; stroke-dashoffset: 0; opacity: 1; }
        .ghost { opacity: 0.85; }
      }
      ]]>
    </style>
  </defs>

  <ellipse class="aura" cx="48" cy="40" rx="40" ry="32" fill="url(#akAura)"/>

  <g class="mark" filter="url(#akSoft)">
    <!-- Whisper fill — glass, not solid chrome -->
    <path class="ghost" d="
      M14 50
      L18 36
      L30 16
      L40 34
      L48 10
      L56 34
      L66 16
      L78 36
      L82 50
      Z
    "/>

    <!-- Primary wire crown -->
    <path class="wire" d="
      M14 50
      L18 36
      L30 16
      L40 34
      L48 10
      L56 34
      L66 16
      L78 36
      L82 50
    "/>

    <!-- Base line -->
    <path class="base" d="M18 56 H78" fill="none"/>
    <!-- Micro secondary base (editorial double rule) -->
    <path class="base" d="M28 60 H68" fill="none" opacity="0.45" stroke-width="0.9"/>

    <!-- Constellation nodes at peaks + base ends -->
    <circle class="node n3" cx="48" cy="10" r="2.15"/>
    <circle class="node n1" cx="30" cy="16" r="1.55"/>
    <circle class="node n5" cx="66" cy="16" r="1.55"/>
    <circle class="node n2" cx="18" cy="36" r="1.25"/>
    <circle class="node n4" cx="78" cy="36" r="1.25"/>
    <circle class="node n1" cx="14" cy="50" r="1.1"/>
    <circle class="node n5" cx="82" cy="50" r="1.1"/>
    <circle class="node n3" cx="48" cy="56" r="1.35"/>
  </g>
</svg>
