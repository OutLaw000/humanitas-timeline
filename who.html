<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Search a name — Humanitas</title>
  <meta name="description" content="Look up any name. The 110, the public record, or a polite rejection." />
  <meta name="theme-color" content="#03050a" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css?v=7" />
</head>
<body>
  <canvas id="phylo-field" aria-hidden="true"></canvas>
  <div class="field-veil" aria-hidden="true"></div>

  <header class="site-header" id="site-header">
    <div class="header-inner">
      <a href="/" class="brand">
        <span class="brand-mark" aria-hidden="true">H</span>
        <span class="brand-text">
          <span class="brand-name">Humanitas</span>
          <span class="brand-sub">Phylogeny of greatness</span>
        </span>
      </a>
      <form class="who-search" action="/who" method="get" role="search">
        <label class="sr-only" for="who-q">Search any name</label>
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
        <input id="who-q" name="q" type="search" placeholder="Search any name…" maxlength="80" autocomplete="off" enterkeyhint="search" />
        <button type="submit" class="sr-only">Search</button>
        <div class="who-suggest" hidden></div>
      </form>
      <nav class="nav">
        <a class="nav-btn" href="/#timeline">Timeline</a>
        <a class="nav-btn" href="/#thesis">Thesis</a>
        <a class="nav-btn nav-btn-accent" href="/">Explore</a>
      </nav>
    </div>
  </header>

  <main class="who-page fig-page" id="who-page">
    <a class="fig-back" href="/">← Humanitas timeline</a>
    <div id="who-root"><p class="who-loading">Opening the archive…</p></div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <ameriking-made></ameriking-made>
    </div>
  </footer>

  <script src="/data1.js"></script>
  <script src="/data2.js"></script>
  <script src="/data3.js"></script>
  <script src="/data4.js"></script>
  <script src="/data5.js"></script>
  <script src="/data6.js"></script>
  <script src="/data-enrichment.js"></script>
  <script src="/data-images.js"></script>
  <script src="/field.js"></script>
  <script src="/who-search.js"></script>
  <script src="/who.js?v=7"></script>
  <script src="https://ameriking.io/made.js?v=6" defer></script>
</body>
</html>
