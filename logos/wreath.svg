<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Humanitas constellation wreath">
  <title>Humanitas — constellation laurel wreath</title>
  <style>
    .wr-branch { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 200; stroke-dashoffset: 200; animation: wr-draw 2.2s ease-out forwards; }
    .wr-right { animation-delay: .12s; }
    .wr-node { opacity: 0; animation: wr-pop .35s ease-out forwards, wr-twinkle 2.8s ease-in-out infinite; }
    .wr-node:nth-child(1) { animation-delay: .25s, 1.1s; }
    .wr-node:nth-child(2) { animation-delay: .4s, 1.4s; }
    .wr-node:nth-child(3) { animation-delay: .55s, 1.7s; }
    .wr-node:nth-child(4) { animation-delay: .7s, 2.0s; }
    .wr-node:nth-child(5) { animation-delay: .85s, 2.3s; }
    .wr-node:nth-child(6) { animation-delay: .4s, 1.55s; }
    .wr-node:nth-child(7) { animation-delay: .55s, 1.85s; }
    .wr-node:nth-child(8) { animation-delay: .7s, 2.15s; }
    .wr-node:nth-child(9) { animation-delay: .85s, 2.45s; }
    .wr-h { opacity: 0; animation: wr-pop .45s ease-out .8s forwards; }
    .wr-star { transform-origin: 32px 7.2px; opacity: 0; animation: wr-pop .4s ease-out 1s forwards, wr-pulse 2.4s ease-in-out 1.3s infinite; }
    @keyframes wr-draw { to { stroke-dashoffset: 0; } }
    @keyframes wr-pop { to { opacity: 1; } }
    @keyframes wr-twinkle { 0%, 100% { opacity: .6; } 50% { opacity: 1; } }
    @keyframes wr-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }
    @media (prefers-reduced-motion: reduce) {
      .wr-branch { stroke-dasharray: none; stroke-dashoffset: 0; animation: none; }
      .wr-node, .wr-h, .wr-star { animation: none !important; opacity: 1 !important; transform: none !important; }
    }
  </style>
  <!-- two laurel branches, leaflets along the outside, tied at the bottom -->
  <path class="wr-branch" d="M32 55C19 50 13 41 13.5 31.5 14 21 22 13 32 11" stroke="#5eead4" stroke-width="1.75"/>
  <path class="wr-branch" d="M22 50c-3-1.2-4.2-4-2.2-6.2M18 43c-3.2-1-4.2-4.2-2-6.4M15.5 35c-3.2-.6-4-4-1.8-6.2M15 27c-2.8-1.2-3.2-4.4-.8-6.4M19 20c-2.2-2-1.8-5.2 1-6.6M25 14.5c-1.4-2.4.2-5.2 2.8-5.8" stroke="#5eead4" stroke-width="1.3"/>
  <path class="wr-branch wr-right" d="M32 55C45 50 51 41 50.5 31.5 50 21 42 13 32 11" stroke="#a78bfa" stroke-width="1.75"/>
  <path class="wr-branch wr-right" d="M42 50c3-1.2 4.2-4 2.2-6.2M46 43c3.2-1 4.2-4.2 2-6.4M48.5 35c3.2-.6 4-4 1.8-6.2M49 27c2.8-1.2 3.2-4.4.8-6.4M45 20c2.2-2 1.8-5.2-1-6.6M39 14.5c1.4-2.4-.2-5.2-2.8-5.8" stroke="#a78bfa" stroke-width="1.3"/>
  <g fill="#f5c16c">
    <circle class="wr-node" cx="32" cy="55" r="1.55"/>
    <circle class="wr-node" cx="21" cy="50" r="1.35"/>
    <circle class="wr-node" cx="14.8" cy="39" r="1.4"/>
    <circle class="wr-node" cx="15.2" cy="26.5" r="1.3"/>
    <circle class="wr-node" cx="24.5" cy="14.2" r="1.35"/>
    <circle class="wr-node" cx="43" cy="50" r="1.35"/>
    <circle class="wr-node" cx="49.2" cy="39" r="1.4"/>
    <circle class="wr-node" cx="48.8" cy="26.5" r="1.3"/>
    <circle class="wr-node" cx="39.5" cy="14.2" r="1.35"/>
  </g>
  <g class="wr-h" stroke-linecap="round">
    <path d="M25.5 23.5v17" stroke="#5eead4" stroke-width="2.8"/>
    <path d="M38.5 23.5v17" stroke="#a78bfa" stroke-width="2.8"/>
    <path d="M25.5 32h13" stroke="#f5c16c" stroke-width="2.7"/>
  </g>
  <path class="wr-star" d="M32 4.4l.85 2.45h2.55l-2.05 1.5.8 2.45L32 9.3l-2.15 1.5.8-2.45-2.05-1.5h2.55z" fill="#ffb84d"/>
</svg>
